[package]
name = "montscan"
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.92"
repository = "https://github.com/SystemVll/Montscan"

[dependencies]
anyhow = "1"
colored = "3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
